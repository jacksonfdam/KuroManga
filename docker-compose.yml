name: manga

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: ./backend
    image: manga-pipeline:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-manga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manga}
      POSTGRES_DB: ${POSTGRES_DB:-manga}
      LIBRARY_PATH: ${LIBRARY_PATH:-/manga}
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-3}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
      KOMGA_URL: ${KOMGA_URL:-http://komga:25600}
      KOMGA_API_KEY: ${KOMGA_API_KEY:-}
      KOMGA_USER: ${KOMGA_USER:-}
      KOMGA_PASS: ${KOMGA_PASS:-}
      KOMGA_LIBRARY_NAME: ${KOMGA_LIBRARY_NAME:-Manga}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${LIBRARY_PATH_HOST:-./data/manga}:/manga:ro
    logging: *logging

  worker:
    build: ./backend
    image: manga-pipeline:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-manga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manga}
      POSTGRES_DB: ${POSTGRES_DB:-manga}
      LIBRARY_PATH: ${LIBRARY_PATH:-/manga}
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-3}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
      KOMGA_URL: ${KOMGA_URL:-http://komga:25600}
      KOMGA_API_KEY: ${KOMGA_API_KEY:-}
      KOMGA_USER: ${KOMGA_USER:-}
      KOMGA_PASS: ${KOMGA_PASS:-}
      KOMGA_LIBRARY_NAME: ${KOMGA_LIBRARY_NAME:-Manga}
    command: python -m app.worker.main
    # Same uid as komga, so the files this writes are the files komga can read.
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ${LIBRARY_PATH_HOST:-./data/manga}:/manga
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    logging: *logging

  bootstrap:
    build: ./backend
    image: manga-pipeline:local
    restart: "no"
    environment:
      LIBRARY_PATH: ${LIBRARY_PATH:-/manga}
      KOMGA_URL: ${KOMGA_URL:-http://komga:25600}
      KOMGA_API_KEY: ${KOMGA_API_KEY:-}
      KOMGA_USER: ${KOMGA_USER:-}
      KOMGA_PASS: ${KOMGA_PASS:-}
      KOMGA_LIBRARY_NAME: ${KOMGA_LIBRARY_NAME:-Manga}
    command: python -m app.komga.bootstrap
    depends_on:
      komga:
        condition: service_started
    logging: *logging

  komga:
    image: gotson/komga:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Lisbon}
    # Runs as the image's own user. Overriding it breaks /config, which komga
    # owns and writes; the library it only reads, so world-readable files from
    # the worker are enough.
    volumes:
      - komga_config:/config
      - ${LIBRARY_PATH_HOST:-./data/manga}:/manga:ro
    ports:
      - "25600:25600"
    logging: *logging

volumes:
  pgdata:
  komga_config:
