name: kuromanga

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-worker-env: &worker-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-manga}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manga}
  POSTGRES_DB: ${POSTGRES_DB:-manga}
  LIBRARY_PATH: ${LIBRARY_PATH:-/manga}
  DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-3}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
  MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
  ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
  ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
  MANGABAKA_TOKEN: ${MANGABAKA_TOKEN:-}
  MANGADEX_CLIENT_ID: ${MANGADEX_CLIENT_ID:-}
  MANGADEX_CLIENT_SECRET: ${MANGADEX_CLIENT_SECRET:-}
  MANGADEX_USERNAME: ${MANGADEX_USERNAME:-}
  MANGADEX_PASSWORD: ${MANGADEX_PASSWORD:-}
  KOMGA_URL: ${KOMGA_URL:-http://komga:25600}
  KOMGA_API_KEY: ${KOMGA_API_KEY:-}
  KOMGA_USER: ${KOMGA_USER:-}
  KOMGA_PASS: ${KOMGA_PASS:-}
  KOMGA_LIBRARY_NAME: ${KOMGA_LIBRARY_NAME:-Manga}
  COMICK_API_URL: ${COMICK_API_URL:-http://comick:3000}
  FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build: ./backend
    image: kuromanga:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-manga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manga}
      POSTGRES_DB: ${POSTGRES_DB:-manga}
      LIBRARY_PATH: ${LIBRARY_PATH:-/manga}
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-3}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
      MANGABAKA_TOKEN: ${MANGABAKA_TOKEN:-}
      # Kept in step with x-worker-env by hand, because this service lists its
      # environment rather than sharing that anchor. The API only resolves a
      # source from a URL today and never fetches, so a missing solver URL was
      # invisible - which is exactly how the two lists drift apart.
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      MANGADEX_CLIENT_ID: ${MANGADEX_CLIENT_ID:-}
      MANGADEX_CLIENT_SECRET: ${MANGADEX_CLIENT_SECRET:-}
      MANGADEX_USERNAME: ${MANGADEX_USERNAME:-}
      MANGADEX_PASSWORD: ${MANGADEX_PASSWORD:-}
      KOMGA_URL: ${KOMGA_URL:-http://komga:25600}
      KOMGA_API_KEY: ${KOMGA_API_KEY:-}
      KOMGA_USER: ${KOMGA_USER:-}
      KOMGA_PASS: ${KOMGA_PASS:-}
      KOMGA_LIBRARY_NAME: ${KOMGA_LIBRARY_NAME:-Manga}
      COMICK_API_URL: ${COMICK_API_URL:-http://comick:3000}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${LIBRARY_PATH_HOST:-./data/manga}:/manga:ro
    logging: *logging

  worker:
    build: ./backend
    image: kuromanga:local
    restart: unless-stopped
    environment:
      <<: *worker-env
      LANE: fetch
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-3}
    command: python -m app.worker.main
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      # Read-only: chapter_discover runs in this lane and its
      # reconcile_with_disk fallback reads the library when Komga cannot
      # answer. Take the mount away and it finds nothing rather than
      # failing, so a downloaded series merely looks undownloaded.
      - ${LIBRARY_PATH_HOST:-./data/manga}:/manga:ro
    logging: *logging

  worker-download:
    build: ./backend
    image: kuromanga:local
    restart: unless-stopped
    environment:
      <<: *worker-env
      LANE: download
    command: python -m app.worker.main
    # Same uid as komga, so the files this writes are the files komga can
    # read. Only this lane writes archives.
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ${LIBRARY_PATH_HOST:-./data/manga}:/manga
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    logging: *logging

  bootstrap:
    build: ./backend
    image: kuromanga:local
    restart: "no"
    environment:
      LIBRARY_PATH: ${LIBRARY_PATH:-/manga}
      KOMGA_URL: ${KOMGA_URL:-http://komga:25600}
      KOMGA_API_KEY: ${KOMGA_API_KEY:-}
      KOMGA_USER: ${KOMGA_USER:-}
      KOMGA_PASS: ${KOMGA_PASS:-}
      KOMGA_LIBRARY_NAME: ${KOMGA_LIBRARY_NAME:-Manga}
    command: python -m app.komga.bootstrap
    depends_on:
      komga:
        condition: service_started
    logging: *logging

  comick:
    # Optional, and now actually optional. Every document called it that while
    # the compose file started it for everyone: the upstream ships no
    # Dockerfile, so the recipe here builds it from source, and a first
    # `docker compose up` compiled a third-party service for anyone sourcing
    # chapters from MangaDex alone. Start it with
    # `docker compose --profile comick up -d`.
    profiles: ["comick"]
    build: ./docker/comick
    restart: unless-stopped
    expose:
      - "3000"
    logging: *logging

  flaresolverr:
    # Headless Chrome, several hundred megabytes - behind its own profile so
    # `docker compose up -d` never pulls it for someone sourcing only from
    # MangaDex. Start it explicitly with
    # `docker compose --profile flaresolverr up -d`.
    profiles: ["flaresolverr"]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Lisbon}
    expose:
      - "8191"
    logging: *logging

  komga:
    image: gotson/komga:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Lisbon}
    # Runs as the image's own user. Overriding it breaks /config, which komga
    # owns and writes; the library it only reads, so world-readable files from
    # the worker are enough.
    volumes:
      - komga_config:/config
      - ${LIBRARY_PATH_HOST:-./data/manga}:/manga:ro
    ports:
      - "25600:25600"
    logging: *logging

volumes:
  pgdata:
  komga_config:
