[project]
name = "kuromanga"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "selectolax>=0.3",
    "apscheduler>=3.10",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mcp>=2.2",
]
# The MCP server is spawned by a model's client, not by Compose, so the SDK is
# an extra rather than a runtime dependency of the api and worker images.
mcp = [
    "mcp>=2.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Decimal("12") states the intent of a decimal literal; the numeric form does not.
# Tests also reach for module internals on purpose.
"tests/*" = ["FURB157", "PLR0402", "SLF001"]
