name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to the same branch makes the previous run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga
          POSTGRES_DB: manga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manga -d manga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A fresh database every run. That is the point: a test module that relies
      # on another having migrated first passes locally and fails here.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: manga
      POSTGRES_PASSWORD: manga
      POSTGRES_DB: manga
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # A virtual environment rather than --system: the runner's interpreter is
        # externally managed and refuses. This also matches what the README tells
        # a developer to do, so CI and a laptop run the same way.
        run: |
          uv venv
          uv pip install -e ".[dev]" alembic

      - name: Fail fast on more than one migration head
        # A fork is invisible on the branch that creates it -- each migration
        # looks correct on its own, added from whatever head existed when it was
        # written. Checking here, before anything else runs, names the real
        # problem instead of the wall of unrelated errors the test suite's
        # session-scoped schema fixture produces once `alembic upgrade head` can
        # no longer pick a head (#71).
        run: |
          HEADS="$(.venv/bin/python -m alembic heads)"
          if [ "$(echo "$HEADS" | wc -l)" -ne 1 ]; then
            echo "::error::The migration chain has more than one head:"
            echo "$HEADS"
            echo "Re-parent one migration onto the other by changing its down_revision to"
            echo "the other head's revision id. Leave its own revision id alone -- that id"
            echo "is what a database that already ran it has recorded in alembic_version,"
            echo "so renaming it strands that database rather than fixing anything. See"
            echo "d4fa919 for a worked example."
            exit 1
          fi

      - name: Verify the migration applies on top of origin/main
        # `alembic upgrade head` against an empty database only proves the chain
        # resolves from nothing. Every real deployment upgrades a database that is
        # already at main's head, and a migration that only works from empty would
        # still pass the check above. This applies main's migrations first, in a
        # separate worktree so the branch's own checkout is untouched, then the
        # branch's migrations on top -- against a throwaway database, so the fresh
        # one the test suite expects is left alone. A push to main has no separate
        # base to compare against, so this only runs for a pull request.
        if: github.event_name == 'pull_request'
        env:
          POSTGRES_DB: migration_guard_check
        run: |
          # The checkout above is shallow and its fetch refspec is scoped to this
          # pull request's own ref, so `git fetch origin main` updates FETCH_HEAD
          # without necessarily creating a refs/remotes/origin/main to point at --
          # `git worktree add ... origin/main` then fails with "invalid reference"
          # on essentially every pull request. FETCH_HEAD is what the fetch just
          # wrote and always exists; --detach is required because it is not a
          # branch.
          git fetch --depth=1 origin main
          WORKTREE="$RUNNER_TEMP/main-migrations"
          git worktree add --detach "$WORKTREE" FETCH_HEAD

          .venv/bin/python -c "
          import asyncio, asyncpg, os

          async def main():
              conn = await asyncpg.connect(
                  host=os.environ['POSTGRES_HOST'],
                  port=int(os.environ['POSTGRES_PORT']),
                  user=os.environ['POSTGRES_USER'],
                  password=os.environ['POSTGRES_PASSWORD'],
                  database='postgres',
              )
              await conn.execute('CREATE DATABASE ' + os.environ['POSTGRES_DB'])
              await conn.close()

          asyncio.run(main())
          "

          (cd "$WORKTREE/backend" && "$GITHUB_WORKSPACE/backend/.venv/bin/python" -m alembic upgrade head)
          .venv/bin/python -m alembic upgrade head

          git worktree remove "$WORKTREE" --force

      - name: Lint
        run: .venv/bin/ruff check app/ tests/

      - name: Test
        run: .venv/bin/pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit
        # Fails the build on a known vulnerability rather than waiting for
        # someone to run this by hand.
        run: npm audit --audit-level=high

      - name: Build
        # Runs tsc first, so this type-checks as well as bundles.
        run: npm run build

  attribution:
    # The commit-msg hook only runs for a clone that enabled it, and it never
    # sees a pull request description at all. Twelve descriptions carried tool
    # attribution before anyone noticed. This is the gate that cannot be skipped
    # by forgetting a git config.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the title and description
        # Through the environment, never interpolated into the script: a pull
        # request body is untrusted text, and `${{ }}` inside run: would let it
        # end the quoting and run as shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > pr-text.txt
          if ! .github/attribution-check.sh pr-text.txt "the pull request title or description"; then
            exit 1
          fi

      - name: Check the commit messages
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git log --format=%B "origin/$BASE_REF..HEAD" > commit-text.txt
          if ! .github/attribution-check.sh commit-text.txt "a commit message on this branch"; then
            exit 1
          fi
